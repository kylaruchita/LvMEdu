<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log In | Livin' Merchant</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#0B3B6B; --sky:#58B4E6; --sky-soft:#7CC4EE; --blue:#1F86C8; --gold:#F5B82E; --ink:#10203A; --ink-soft:#56637A; --line:#DCE6F1; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{ font-family:"Montserrat",system-ui,sans-serif; color:var(--ink); background:linear-gradient(135deg,var(--sky-soft),var(--sky)); display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ width:100%; max-width:410px; background:#fff; border-radius:22px; padding:30px 28px 26px; border-top:5px solid var(--gold); box-shadow:0 30px 60px -30px rgba(11,59,107,.55); }
  .logo{ display:block; width:190px; max-width:70%; height:auto; margin:0 auto 6px; }
  h1{ font-size:1.25rem; font-weight:800; color:var(--navy); text-align:center; margin:0 0 4px; }
  .sub{ text-align:center; color:var(--ink-soft); font-size:.86rem; margin:0 0 22px; }
  label{ display:block; font-size:.8rem; font-weight:700; color:var(--navy); margin:14px 0 6px; }
  .inp{ position:relative; }
  input{ width:100%; padding:13px 14px; border:1.5px solid var(--line); border-radius:11px; font:inherit; font-size:.95rem; color:var(--ink); background:#fff; }
  input:focus{ outline:none; border-color:var(--sky); box-shadow:0 0 0 3px rgba(88,180,230,.3); }
  .inp input{ padding-right:70px; }
  .toggle{ position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--blue); font:inherit; font-size:.78rem; font-weight:700; cursor:pointer; padding:6px 8px; }
  .err{ display:none; margin-top:14px; background:#FDECEC; color:#B42318; border-radius:10px; padding:10px 12px; font-size:.82rem; font-weight:600; }
  .err.show{ display:block; }
  .btn{ width:100%; margin-top:20px; border:none; border-radius:100px; padding:14px; background:var(--navy); color:#fff; font:inherit; font-weight:800; font-size:.95rem; cursor:pointer; }
  .btn:hover{ filter:brightness(1.12); }
  .back{ display:block; text-align:center; margin-top:16px; color:var(--blue); font-size:.84rem; font-weight:600; text-decoration:none; }
  .back:hover{ text-decoration:underline; }
</style>
</head>

    <h1>Selamat Datang</h1>
    <p class="sub">Silakan log in untuk membuka Mandiri Spot Kawasan.</p>
    <div id="form">
      <label for="user">Username</label>
      <input id="user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
      <label for="pass">Password</label>
      <div class="inp">
        <input id="pass" type="password" autocomplete="current-password">
        <button type="button" class="toggle" id="toggle">Lihat</button>
      </div>
      <div class="err" id="err" role="alert">Username atau password salah. Coba lagi.</div>
      <button class="btn" id="go" type="button">Log In</button>
    </div>
    <a class="back" href="index.html">&larr; Kembali ke Panduan Livin' Merchant</a>
  </main>
<script>
  var USER='Mandiri1', PASS='Mandiri1', TARGET='mandiri_spot_login.html';
  var u=document.getElementById('user'), p=document.getElementById('pass'), err=document.getElementById('err');
  try{ if(sessionStorage.getItem('lvm_auth')==='1'){ location.replace(TARGET); } }catch(e){}
  function submit(){
    if(u.value.trim()===USER && p.value===PASS){
      try{ sessionStorage.setItem('lvm_auth','1'); }catch(e){}
      location.href=TARGET;
    }else{ err.classList.add('show'); p.select(); }
  }
  document.getElementById('go').addEventListener('click',submit);
  [u,p].forEach(function(el){ el.addEventListener('keydown',function(e){ if(e.key==='Enter'){ submit(); } }); el.addEventListener('input',function(){ err.classList.remove('show'); }); });
  document.getElementById('toggle').addEventListener('click',function(){
    var show=p.type==='password'; p.type=show?'text':'password'; this.textContent=show?'Sembunyikan':'Lihat';
  });
  u.focus();
</script>
